interface:
  display_name: "Windows PowerShell Encoding"
  short_description: "Avoid UTF-8 and mojibake pitfalls on Windows; prefer pwsh 7.6.1+"
  default_prompt: "Use $windows-powershell-encoding-skill to inspect this Windows PowerShell workflow for UTF-8, CJK, and mojibake risks. Prefer pwsh 7.6.1+, treat Windows PowerShell 5.1 as legacy, and verify non-ASCII text outside terminal rendering."

policy:
  allow_implicit_invocation: true
